replicaCount: 1

image:
  registry: ghcr.io/milanpanic2
  name: web-scraper
  tag: main
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  host: scraper.homelab.com
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    # ForwardAuth via auth service - requires valid JWT to access
    traefik.ingress.kubernetes.io/router.middlewares: apps-auth-verify@kubernetescrd

config:
  apiHost: "0.0.0.0"
  apiPort: "8000"
  environment: "default"
  debug: "false"
  maxConcurrentScrapers: "5"
  scraperTimeout: "30"
  otelEndpoint: "http://alloy.monitoring.svc.cluster.local:4317"

database:
  host: "postgresql"
  port: "5432"
  name: "web-scraper"
  user: "cluster_user"
  secretName: "cluster-secret"

storage:
  size: 10Gi

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

probes:
  liveness:
    httpGet:
      path: /api/v1/health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /api/v1/health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
